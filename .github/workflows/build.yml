name: Build Kernel (AOSP Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git libelf-dev libssl-dev lzma lzop rsync zip wget python3

      - name: Clean source
        run: |
          make O=out ARCH=arm64 mrproper || true

      - name: Setup AOSP Clang (latest)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          CLANG_DIR=$(find "$GITHUB_WORKSPACE/clang" -maxdepth 1 -type d -name "clang-r*" | sort | tail -n 1)
          echo "Using Clang at: $CLANG_DIR"
          echo "$CLANG_DIR/bin" >> $GITHUB_PATH
          echo "Clang version: $($CLANG_DIR/bin/clang --version | head -1)"

      - name: Integrate KernelSU Next (kprobe method)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Enable KernelSU + KPROBE config
        run: |
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/vendor/xiaomi/miatoll_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/vendor/xiaomi/miatoll_defconfig
          echo "CONFIG_KSU_KPROBE_HOOKS=y" >> arch/arm64/configs/vendor/xiaomi/miatoll_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/xiaomi/miatoll_defconfig

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 vendor/xiaomi/miatoll_defconfig
          # Force disable Shadow Call Stack after defconfig (may get re-enabled by dependency resolution)
          scripts/config --file out/.config -d SHADOW_CALL_STACK
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC="clang --target=aarch64-linux-gnu" \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu-

      - name: KernelSU verification
        run: |
          echo "===== CONFIG CHECK ====="
          grep CONFIG_KSU out/.config || echo "❌ CONFIG_KSU NOT FOUND"

          echo "===== KPROBE CHECK ====="
          grep CONFIG_KPROBES out/.config || echo "❌ KPROBES NOT FOUND"

          echo "===== SHADOW CALL STACK CHECK ====="
          grep CONFIG_SHADOW_CALL_STACK out/.config || echo "✅ SHADOW_CALL_STACK not set (correct)"

          echo "===== KERNELSU CHECK ====="
          find out -name "*ksu*" || echo "❌ KernelSU NOT BUILT"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: out/arch/arm64/boot/*
          
